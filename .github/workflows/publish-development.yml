name: Publish development release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing five-part development version tag
        required: true
        type: string
      title:
        description: Optional release title
        required: false
        type: string
      replace:
        description: Replace the package and notes on an existing development release
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-config
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^\d+\.\d+\.\d+\.\d+\.[1-9]\d*$') {
            throw 'Expected a five-part development version'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.replace && github.sha || inputs.tag }}
          path: source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Regression checks
        run: dotnet run --project source/tests/Regression/Regression.csproj
      - name: Touch button input checks
        if: hashFiles('source/tests/TouchButtons/TouchButtons.csproj') != ''
        run: dotnet run --project source/tests/TouchButtons/TouchButtons.csproj
      - name: Noise counting algorithm checks
        if: hashFiles('source/tests/NoiseAlgorithm/NoiseAlgorithm.csproj') != ''
        run: dotnet run --project source/tests/NoiseAlgorithm/NoiseAlgorithm.csproj
      - name: Image memory regression
        run: dotnet run --project source/tests/BackgroundMemory/BackgroundMemory.csproj
      - name: Backdrop lifecycle stress
        run: dotnet run --project source/tests/BackdropLifecycle/BackdropLifecycle.csproj
      - name: Bounded UI queue lifecycle
        run: dotnet run --project source/tests/UiWork/UiWork.csproj
      - name: Hotkey lifecycle
        run: dotnet run --project source/tests/HotkeyLifetime/HotkeyLifetime.csproj
      - name: Build package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $base, $counter = $env:RELEASE_TAG -split '\.(?=[^.]+$)'
          $manifest = Get-Content source/manifest.yml -Raw
          if ($manifest -notmatch "(?m)^version: $([regex]::Escape($base))\s*$") {
            throw 'Tag base version does not match manifest'
          }
          $counterFile = Join-Path $env:RUNNER_TEMP 'devbuild.txt'
          Set-Content $counterFile @($base, ([long]$counter - 1))
          dotnet build source/EveningSelfStudyClock.csproj -c Release -p:DevBuild=1 "-p:DevBuildCounterFile=$counterFile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $builtManifest = Get-Content source/bin/Release/net8.0-windows/manifest.yml -Raw
          if ($builtManifest -notmatch "(?m)^version: $([regex]::Escape($env:RELEASE_TAG))\s*$") {
            throw 'Package version mismatch'
          }
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          REPLACE_RELEASE: ${{ inputs.replace }}
        run: |
          $checksum = Get-Content source/cipx/checksums.md -Raw
          $notes = Get-Content "release-config/.github/release-notes/$env:RELEASE_TAG.md" -Raw
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content $notesFile "$checksum`n`n$notes"
          $title = $env:RELEASE_TITLE
          if ([string]::IsNullOrWhiteSpace($title)) { $title = "$env:RELEASE_TAG 开发版（Codex）" }
          if ($env:REPLACE_RELEASE -eq 'true') {
            gh release view $env:RELEASE_TAG --json tagName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $tagRef = "refs/tags/$env:RELEASE_TAG"
            $remoteTag = git -C release-config ls-remote --refs origin $tagRef
            if ($LASTEXITCODE -ne 0 -or -not $remoteTag) { throw 'Existing release tag not found' }
            $previousSha = ($remoteTag -split '\s+')[0]
            git -C release-config push "--force-with-lease=${tagRef}:$previousSha" origin "${env:GITHUB_SHA}:$tagRef"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $env:RELEASE_TAG source/cipx/EveningSelfStudyClock.cipx --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:RELEASE_TAG --title $title --notes-file $notesFile
          } else {
            gh release create $env:RELEASE_TAG source/cipx/EveningSelfStudyClock.cipx --verify-tag --prerelease --title $title --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
